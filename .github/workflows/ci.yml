name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-0-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ORIGIN: http://127.0.0.1:3000
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.111.0

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and deterministic seed
        run: supabase db reset --local

      - name: Run database authorization tests
        run: supabase test db

      - name: Check generated database type drift
        run: |
          supabase gen types typescript --local > /tmp/database.types.ts
          npx prettier --write /tmp/database.types.ts
          diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts

      - name: Export local application environment
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > .env.local

      - name: Run application verification
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser authorization acceptance tests
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
