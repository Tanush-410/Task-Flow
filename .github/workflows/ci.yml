name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-0-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ORIGIN: http://127.0.0.1:3000
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 22.22.1
          cache: npm

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.36.0
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Scan repository history for secrets
        uses: step-security/gitleaks-action@v2.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_VERSION: 8.28.0

      - name: Start local Supabase
        run: npx supabase start

      - name: Apply migrations and deterministic seed
        run: npx supabase db reset --local

      - name: Run database authorization tests
        run: npx supabase test db

      - name: Check generated database type drift
        run: |
          npx supabase gen types typescript --local > /tmp/database.types.ts
          npx prettier --write /tmp/database.types.ts
          diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts

      - name: Verify incremental migration path with existing data
        run: |
          npx supabase db reset --local --version 202608010001 --no-seed
          npx supabase status -o env \
            --override-name db.url=UPGRADE_DB_URL \
            > /tmp/taskflow-upgrade-db.env
          . /tmp/taskflow-upgrade-db.env
          psql "$UPGRADE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/fixtures/pre_upgrade.sql
          npx supabase migration up --local
          psql "$UPGRADE_DB_URL" --set ON_ERROR_STOP=1 \
            --file supabase/tests/verify_upgrade.sql

      - name: Restore the current deterministic database
        run: npx supabase db reset --local

      - name: Export local application environment
        run: |
          npx supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            > .env.local

      - name: Run application verification
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser authorization acceptance tests
        run: npm run test:e2e

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4.36.0
        with:
          category: /language:javascript-typescript
